<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="shortcut icon" href="/assets/img/index/bananas.png" type="image/png">
    <link rel="preload" href="/assets/fonts/redrose-variablefont_wght-webfont.ttf" as="font" type="font/ttf"
        crossorigin>
</head>

<body class="m-s0 p-s0 game">
    <div id="game-over-overlay" class="overlay hidden">
        <div class="overlayContent">
            <img class="confetti" src="/assets/img/overlay/confetti.png" alt="confetti">
            <h2>The Winner is</h2>
            <h2 id="winner-text"></h2>
            <img class="winner" id="winner-img" src="" alt="Winner" />
            <button id="home-btn" class="header__exitButton">Home</button>
        </div>
    </div>

    <div id="game-over-initOverlay" class="overlay hidden">
        <div class="overlayContent">
            <img class="gameOverImg" alt="Game over">
            <h2>Final Score</h2>
            <div class="header__player">
                <div class="header__player--blue"><div class="header__player--blueIMG"></div>&nbsp; Blue &nbsp;<div id="blueCounter" class="header__blueScore">0
                    </div>
                </div>
                &nbsp;<div class="header__player--orange"><div class="header__player--orangeIMG"></div>&nbsp; Orange &nbsp;<div id="orangeCounter"
                        class="header__orangeScore">0</div>
                </div>
            </div>
        </div>
    </div>

    <div id="draw-overlay" class="overlay hidden">
        <div class="overlayContent">
            <h2>It´s a</h2>
            <img class="draw" alt="draw">
            <img class="scale" alt="scale">
            <button id="draw-btn" class="header__exitButton">Back to start</button>
        </div>
    </div>

    <div id="exit-overlay" class="exitOverlay">
        <div class="exitOverlayContent">
            <h2>Are you sure you want to quit the game?</h2>
            <div class="exitButtons">
                <button id="game-btn" class="exitButtons__gamebutton">Back to game</button>
                <button id="exit-btn" class="exitButtons__button">Exit game</button>
            </div>
        </div>
    </div>

    <div class="content">
        <header class="header">
            <div class="header__player">
                <div class="header__player--blue">
                    <div class="header__player--blueIMG"></div>&nbsp; Blue &nbsp;<div id="blueCounter"
                        class="header__blueScore">0
                    </div>
                </div>
                &nbsp;<div class="header__player--orange">
                    <div class="header__player--orangeIMG"></div>&nbsp; Orange &nbsp;<div id="orangeCounter"
                        class="header__orangeScore">0</div>
                </div>
            </div>
            <div class="header__currentPlayer">Current player: &nbsp;<div alt="player"
                    class="header__currentPlayer--img"></div>
            </div>
            <button id="header-exit-btn" class="header__exitButton"><img src="/assets/img/header/move_item.svg"
                    alt="quit button display" class="header__exitButtonImg"><strong>Exit game</strong></button>
        </header>

        <section id="field" class="field">

        </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
