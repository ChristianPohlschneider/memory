<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="preload"
      href="/assets/fonts/redrose-variablefont_wght-webfont.ttf"
      as="font"
      type="font/ttf"
      crossorigin>
</head>

<body class="m-s0 p-s0 game">
    <div class="content">
    <header class="header">
        <div class="header__player">
            <div class="header__player--blue"><img src="/assets/img/header/label-blue.svg" alt="blue player" class="header__playerImg">&nbsp; Blue <div class="header__blueScore">0</div></div>
            <div class="header__player--orange"><img src="/assets/img/header/label-orange.svg" alt="orange player" class="header__playerImg">&nbsp; Orange <div class="header__orangeScore">0</div></div>
        </div>
        <div class="header__currentPlayer">Current player: &nbsp;<div alt="player" class="header__currentPlayer--img"></div></div>
        <button class="header__exitButton" onclick="window.location.href='index.html'"><img src="/assets/img/header/move_item.svg" alt="quit button display" class="header__exitButtonImg"><strong>Exit game</strong></button>
    </header>

        <section id="field" class="field">
            <!-- <button class="card">
                <div id="card__inner" class="card__inner">
                <div class="card__face"></div>
                <div class="card__face card__face--back"
                 style="background-image: url('/assets/img/games-theme/${theme}.png')"></div>
            </div>
            </button> -->
        </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
