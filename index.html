<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory App</title>
    <link rel="preload"
      href="/assets/fonts/redrose-variablefont_wght-webfont.ttf"
      as="font"
      type="font/ttf"
      crossorigin>
</head>

<body class="m-s0 p-s0 index">
    <!-- Projekt implementieren:
    npm init -y (initialisierung, alles auf yes)
    npm install -D vite typescript (installation vite und typescript)
    tsc --init (Erstellung tsconfig.json)
        darin einfügen: {
                        "compilerOptions": {
                            /* Sprache & Zielumgebung */
                            "target": "ESNext",                  // moderne Syntax, gut für Browser + Vite
                            "lib": ["ESNext", "DOM"],            // Browser-APIs und moderne JS-Funktionen


                            /* Module & Auflösung */
                            "module": "ESNext",                  // ES Modules für Vite/Rollup
                            "moduleResolution": "Bundler",       // spezielle Auflösung für Vite, ersetzt "node"
                            "isolatedModules": true,             // jede Datei wird wie ein Modul behandelt


                            /* Typprüfung */
                            "strict": true,                      // alle strikten Checks aktivieren
                            "skipLibCheck": true,                // schneller, da node_modules-Typen nicht geprüft werden
                            "noEmit": true,                      // keine JS-Ausgabe, Build übernimmt Vite


                            /* Sonstiges */
                            "esModuleInterop": true,             // bessere Import-Kompatibilität
                            "resolveJsonModule": true,           // erlaubt `import data from './data.json'`
                            "forceConsistentCasingInFileNames": true
                        },
                        "include": ["src"],                    // nur eigenen Code kompilieren
                        "exclude": ["node_modules", "dist"]    // keine Fremd- oder Build-Dateien prüfen
                        }
    scripts in package.json einfügen:
        "scripts": {
                    "dev": "vite",
                    "build": "tsc -noEmit && vite build",
                    "preview": "vite preview"
                    }
    index.html auf oberster Ebene erstellen (!)
    src ordner erstellen und main.ts innerhalb
    script in index.html einfügen (<script type="module" src="/src/main.ts"></script>)

    scripte könne nun ausgeführt werden:
    npm run dev -> 'live-server' für scss und typescript

    npm i -D sass -> sass installieren

    ordner in src erstellen: styles/styles.scss
    -->
    <img src="/assets/img/index/stadia_controller large.png" alt="large controller" class="controller-large">
    <div class="home">
        <div class="playTimeDiv">
            <p class="playTime m-s0">It´s play time.</p>
        </div>
        <div>
            <h1 class="readyToPlay m-s0">Ready to play?</h1>
        </div>
        <div><button class="playButton" onclick="window.location.href='settings.html'"><img src="/assets/img/index/stadia_controller.svg" alt="controller" class="controller-small"><strong>Play</strong><img src="/assets/img/index/Arrow 1.svg" alt="arrow" class="arrow "></button></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
